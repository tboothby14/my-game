<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backgammon</title>
<style>
  /* Look and feel: tweak these CSS variables if you like. (JS also sets sizes from CONFIG below.) */
  body { font-family: Arial, sans-serif; background: #2b2b2b; color: #eee; text-align: center; margin: 0; padding: 10px; }
  h1 { margin: 6px 0; font-size: 24px; }
  #status { font-size: 18px; margin: 6px; min-height: 24px; }
  #message { color: #ffd966; min-height: 22px; margin-bottom: 6px; }
  button { font-size: 16px; padding: 6px 14px; margin: 0 4px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* The board is a grid: 6 points | bar | 6 points | bear-off tray, in 2 rows (top and bottom). */
  #board { display: grid; margin: 10px auto; background: var(--board); border: 6px solid #4a2c0f;
           grid-template-columns: repeat(6, var(--pw)) var(--bar-w) repeat(6, var(--pw)) var(--off-w);
           grid-template-rows: var(--half-h) var(--half-h); width: max-content; }
  .point { position: relative; display: flex; flex-direction: column; align-items: center; cursor: default; }
  .point.top { justify-content: flex-start; }
  .point.bottom { justify-content: flex-end; }
  /* The triangle is drawn behind the checkers. */
  .point::before { content: ""; position: absolute; left: 4px; right: 4px; top: 0; bottom: 0; z-index: 0; background: var(--tri-a); }
  .point.top::before { clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .point.bottom::before { clip-path: polygon(0 100%, 100% 100%, 50% 0); }
  .point.alt::before { background: var(--tri-b); }
  .point.target::before { background: var(--target); }
  .point.target { cursor: pointer; }
  .label { position: absolute; font-size: 10px; color: #ccc; z-index: 2; }
  .top .label { bottom: 2px; } .bottom .label { top: 2px; }

  .checker { width: var(--cs); height: var(--cs); border-radius: 50%; border: 2px solid #555; box-sizing: border-box;
             z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
  .checker.white { background: var(--white); color: #000; }
  .checker.black { background: var(--black); color: #fff; border-color: #999; }
  .checker.mine { cursor: pointer; }
  .checker.selected { box-shadow: 0 0 0 4px var(--select); }

  /* The bar and the bear-off tray each have a top half and a bottom half. */
  .column { display: grid; grid-row: 1 / span 2; grid-template-rows: 1fr 1fr; background: var(--bar); }
  .slot { display: flex; flex-direction: column; align-items: center; padding-top: 6px; font-size: 12px; position: relative; }
  .slot.bottom { justify-content: flex-end; padding-bottom: 6px; padding-top: 0; }
  .slot.target { background: var(--target); cursor: pointer; }
  .slot .tag { color: #ccc; }

  #dice { margin: 8px; min-height: 50px; }
  .die { display: inline-block; width: 44px; height: 44px; line-height: 44px; font-size: 26px; font-weight: bold;
         background: #fff; color: #000; border-radius: 8px; margin: 0 5px; }
  .die.used { opacity: 0.25; }

  #winner { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 10;
            flex-direction: column; align-items: center; justify-content: center; }
  #winner h2 { font-size: 48px; margin: 10px; }
  #winner button { font-size: 22px; padding: 10px 24px; }
</style>
</head>
<body>
<h1>Backgammon</h1>
<div id="status"></div>
<div id="message"></div>
<div id="board"></div>
<div id="dice"></div>
<div>
  <button id="rollBtn">Roll</button>
  <button id="passBtn">Pass</button>
  <button id="newBtn">New Game</button>
</div>
<div id="winner"><h2 id="winnerText"></h2><button id="winNewBtn">New Game</button></div>

<script>
// ===== TWEAKABLE SETTINGS =====
const CONFIG = {
  pointWidth: 52,        // width of each triangle, in pixels
  halfHeight: 220,       // height of the top (or bottom) half of the board
  checkerSize: 40,       // diameter of a checker
  barWidth: 56,
  offWidth: 70,
  maxStack: 5,           // checkers drawn per point before showing a number instead
  colors: {
    board: '#1f6b3a', barColor: '#4a2c0f', triangleA: '#c9a063', triangleB: '#8b3a2b',
    white: '#f4f0e6', black: '#222', target: '#4fc3f7', select: '#ffeb3b'
  }
};

// ===== GAME STATE (everything about the current game lives here) =====
// points[0..23]: positive number = that many WHITE checkers, negative = BLACK checkers.
// White moves from index 0 up to 23 (home = 18..23). Black moves from 23 down to 0 (home = 0..5).
let game;

function newGame() {
  const points = new Array(24).fill(0);
  // Standard starting position. White (+) ...
  points[0] = 2; points[11] = 5; points[16] = 3; points[18] = 5;
  // ... and Black (-), a mirror image.
  points[23] = -2; points[12] = -5; points[7] = -3; points[5] = -5;
  game = {
    points: points,
    bar:  { white: 0, black: 0 },   // checkers waiting to re-enter
    off:  { white: 0, black: 0 },   // checkers borne off
    turn: 'white',                  // whose turn it is
    dice: [],                       // the two dice as rolled
    movesLeft: [],                  // die values still unused (4 entries on a double)
    rolled: false,                  // has the current player rolled yet?
    selected: null,                 // chosen source: a point index, 'bar', or null
    winner: null,
    message: ''
  };
  render();
}

// ===== RULE HELPERS =====
const sign = p => (p === 'white' ? 1 : -1);
const other = p => (p === 'white' ? 'black' : 'white');
const mineAt = (p, i) => game.points[i] * sign(p) > 0;                       // does p own checkers on point i?
const oppCountAt = (p, i) => (game.points[i] * sign(p) < 0 ? Math.abs(game.points[i]) : 0);

// Are all of p's checkers in the home board (and none on the bar)?
function allHome(p) {
  if (game.bar[p] > 0) return false;
  for (let i = 0; i < 24; i++) {
    const inHome = p === 'white' ? i >= 18 : i <= 5;
    if (mineAt(p, i) && !inHome) return false;
  }
  return true;
}

// Distance of point i from bearing off (1 = last point before off).
const distToOff = (p, i) => (p === 'white' ? 24 - i : i + 1);

// List the legal moves for the current player from `from` (a point index or 'bar').
function legalMoves(from) {
  const p = game.turn, moves = [];
  if (!game.rolled || game.winner) return moves;
  if (game.bar[p] > 0 && from !== 'bar') return moves;       // must enter from the bar first
  if (from === 'bar' && game.bar[p] === 0) return moves;
  if (from !== 'bar' && !mineAt(p, from)) return moves;

  const dir = sign(p);
  for (const die of new Set(game.movesLeft)) {
    let to;
    if (from === 'bar') to = p === 'white' ? die - 1 : 24 - die;   // enter in the opponent's home
    else to = from + dir * die;

    if (to >= 0 && to <= 23) {
      if (oppCountAt(p, to) < 2) moves.push({ to: to, die: die });   // blocked by 2+ opponents
    } else if (from !== 'bar' && allHome(p)) {
      // Bearing off: exact die, or a bigger die if no checker is further back.
      const d = distToOff(p, from);
      let ok = die === d;
      if (!ok && die > d) {
        ok = true;
        for (let j = 0; j < 24; j++) if (mineAt(p, j) && distToOff(p, j) > d) ok = false;
      }
      if (ok) moves.push({ to: 'off', die: die });
    }
  }
  return moves;
}

// Is there any legal move at all for the current player?
function anyLegalMove() {
  if (legalMoves('bar').length) return true;
  for (let i = 0; i < 24; i++) if (legalMoves(i).length) return true;
  return false;
}

// ===== ACTIONS =====
function roll() {
  if (game.rolled || game.winner) return;
  const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
  game.dice = [a, b];
  game.movesLeft = a === b ? [a, a, a, a] : [a, b];   // doubles give four moves
  game.rolled = true;
  game.selected = null;
  game.message = '';
  render();
}

function endTurn() {
  game.turn = other(game.turn);
  game.dice = []; game.movesLeft = []; game.rolled = false; game.selected = null;
  game.message = '';
  render();
}

function doMove(from, move) {
  const p = game.turn, s = sign(p);
  // Pick the checker up...
  if (from === 'bar') game.bar[p]--; else game.points[from] -= s;
  // ...and put it down.
  if (move.to === 'off') {
    game.off[p]++;
  } else {
    if (oppCountAt(p, move.to) === 1) {            // a lone opponent checker is hit and sent to the bar
      game.points[move.to] = 0;
      game.bar[other(p)]++;
      game.message = other(p) + ' was hit and sent to the bar!';
    }
    game.points[move.to] += s;
  }
  game.movesLeft.splice(game.movesLeft.indexOf(move.die), 1);   // use up that die
  game.selected = null;
  if (game.off[p] === 15) { game.winner = p; render(); return; }
  if (game.movesLeft.length === 0) {
    const msg = game.message;
    endTurn();
    game.message = msg;
    render();
    return;
  }
  render();
}

// A click on a point, the bar, or the bear-off tray. `where` is an index, 'bar' or 'off'.
function clickSpot(where) {
  if (game.winner || !game.rolled) return;
  const p = game.turn;
  // If a checker is selected and this is one of its destinations, move there.
  if (game.selected !== null) {
    const move = legalMoves(game.selected).find(m => m.to === where);
    if (move) { doMove(game.selected, move); return; }
    if (game.selected === where) { game.selected = null; render(); return; }   // click again to deselect
  }
  if (where === 'off') return;
  // Otherwise try to select a checker.
  if (game.bar[p] > 0 && where !== 'bar') { game.message = 'You must re-enter your checker from the bar first.'; render(); return; }
  if (where === 'bar' ? game.bar[p] > 0 : mineAt(p, where)) {
    if (legalMoves(where).length) { game.selected = where; game.message = ''; }
    else game.message = 'That checker has no legal moves.';
    render();
  }
}

// ===== DRAWING =====
const $ = id => document.getElementById(id);

// Make a stack of checkers for a container. count checkers of colour `color`.
function addCheckers(box, count, color, isMine, isSelected) {
  const shown = Math.min(count, CONFIG.maxStack);
  for (let k = 0; k < shown; k++) {
    const c = document.createElement('div');
    c.className = 'checker ' + color + (isMine ? ' mine' : '');
    if (isSelected && k === shown - 1) c.classList.add('selected');   // highlight the top checker
    if (k === shown - 1 && count > shown) c.textContent = count;       // show total if stack is tall
    box.appendChild(c);
  }
}

function render() {
  const g = game, p = g.turn;
  // Push CONFIG sizes/colors into CSS variables.
  const root = document.documentElement.style, C = CONFIG.colors;
  root.setProperty('--pw', CONFIG.pointWidth + 'px'); root.setProperty('--half-h', CONFIG.halfHeight + 'px');
  root.setProperty('--cs', CONFIG.checkerSize + 'px'); root.setProperty('--bar-w', CONFIG.barWidth + 'px');
  root.setProperty('--off-w', CONFIG.offWidth + 'px');
  root.setProperty('--board', C.board); root.setProperty('--bar', C.barColor);
  root.setProperty('--tri-a', C.triangleA); root.setProperty('--tri-b', C.triangleB);
  root.setProperty('--white', C.white); root.setProperty('--black', C.black);
  root.setProperty('--target', C.target); root.setProperty('--select', C.select);

  // Which spots can the selected checker go to?
  const targets = g.selected === null ? [] : legalMoves(g.selected).map(m => m.to);

  // Status line, message, buttons.
  const name = p === 'white' ? 'White' : 'Black';
  $('status').textContent = name + "'s turn" + (g.rolled ? '' : ' - click Roll') +
    '   |   Borne off: White ' + g.off.white + ', Black ' + g.off.black;
  let msg = g.message;
  if (g.rolled && !g.winner && !anyLegalMove()) msg = 'No legal moves - click Pass.';
  $('message').textContent = msg;
  $('rollBtn').disabled = g.rolled || !!g.winner;
  $('passBtn').disabled = !g.rolled || !!g.winner;

  // Dice: dice already used are greyed out.
  const left = g.movesLeft.slice();
  $('dice').innerHTML = '';
  g.dice.forEach(d => {
    const el = document.createElement('span');
    el.className = 'die'; el.textContent = d;
    const idx = left.indexOf(d);
    if (idx >= 0) left.splice(idx, 1); else el.classList.add('used');
    $('dice').appendChild(el);
  });
  if (g.dice.length && g.dice[0] === g.dice[1]) {      // double: show how many of the 4 moves remain
    $('dice').innerHTML = '';
    for (let k = 0; k < 4; k++) {
      const el = document.createElement('span');
      el.className = 'die' + (k < 4 - g.movesLeft.length ? ' used' : ''); el.textContent = g.dice[0];
      $('dice').appendChild(el);
    }
  }

  // Board: build the 24 points, the bar and the bear-off tray.
  const board = $('board');
  board.innerHTML = '';
  // Top row shows points 12..17, bar, 18..23. Bottom row shows 11..6, bar, 5..0.
  const topOrder = [12, 13, 14, 15, 16, 17, null, 18, 19, 20, 21, 22, 23];
  const botOrder = [11, 10, 9, 8, 7, 6, null, 5, 4, 3, 2, 1, 0];

  function makePoint(i, pos) {
    const el = document.createElement('div');
    el.className = 'point ' + pos + (i % 2 ? ' alt' : '') + (targets.includes(i) ? ' target' : '');
    const lab = document.createElement('span'); lab.className = 'label'; lab.textContent = i + 1; el.appendChild(lab);
    const n = Math.abs(g.points[i]);
    if (n) {
      const color = g.points[i] > 0 ? 'white' : 'black';
      const isMine = color === p && g.rolled && g.bar[p] === 0;
      addCheckers(el, n, color, isMine, g.selected === i);
    }
    el.onclick = () => clickSpot(i);
    return el;
  }

  // Placing items in order; the bar and tray columns span both rows so they are added once.
  const place = (order, pos, row) => order.forEach((i, col) => {
    if (i === null) return;
    const el = makePoint(i, pos);
    el.style.gridRow = row; el.style.gridColumn = col + 1;
    board.appendChild(el);
  });
  place(topOrder, 'top', 1);
  place(botOrder, 'bottom', 2);

  // The bar: Black's bar checkers on top, White's on the bottom.
  const bar = document.createElement('div');
  bar.className = 'column'; bar.style.gridColumn = 7;
  ['black', 'white'].forEach((color, k) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (k ? ' bottom' : '');
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'BAR'; if (!k) slot.appendChild(tag);
    addCheckers(slot, g.bar[color], color, color === p && g.rolled, g.selected === 'bar' && color === p);
    if (k) slot.appendChild(tag);
    slot.onclick = () => { if (color === p) clickSpot('bar'); };
    bar.appendChild(slot);
  });
  board.appendChild(bar);

  // Bear-off tray: White's (home is top right) on top, Black's on the bottom.
  const tray = document.createElement('div');
  tray.className = 'column'; tray.style.gridColumn = 14;
  ['white', 'black'].forEach((color, k) => {
    const slot = document.createElement('div');
    slot.className = 'slot' + (k ? ' bottom' : '') + (color === p && targets.includes('off') ? ' target' : '');
    const tag = document.createElement('div'); tag.className = 'tag';
    tag.textContent = 'OFF: ' + g.off[color];
    slot.appendChild(tag);
    const c = document.createElement('div'); c.className = 'checker ' + color;
    c.style.width = c.style.height = '24px';
    if (g.off[color]) slot.appendChild(c);
    slot.onclick = () => { if (color === p) clickSpot('off'); };
    tray.appendChild(slot);
  });
  board.appendChild(tray);

  // Winner overlay.
  $('winner').style.display = g.winner ? 'flex' : 'none';
  if (g.winner) $('winnerText').textContent = 'You win, ' + (g.winner === 'white' ? 'White' : 'Black') + '!';
}

// ===== BUTTONS =====
$('rollBtn').onclick = roll;
$('passBtn').onclick = () => { if (game.rolled && !game.winner) endTurn(); };
$('newBtn').onclick = newGame;
$('winNewBtn').onclick = newGame;

newGame();
</script>
</body>
</html>
